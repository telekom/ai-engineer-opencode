name: aie-package

# Build and publish @telekom/* packages to GitHub Packages (npm artifacts only).
# The GitHub Release UI (release notes + downloadable binary assets) is handled
# separately by .github/workflows/aie-publish.yml, triggered by the same `v*-aie`
# tag push so npm publish and Release creation run side-by-side.
#
#   - push to `aie`          -> auto-incrementing prerelease (vX.Y.Z-a.N, dist-tag "aie")
#   - push tag `v*-aie`      -> stable release (dist-tag "latest")
#   - workflow_dispatch       -> manual run (acts like a prerelease on the aie branch)
on:
  push:
    branches:
      - aie
      # TEMP: test the pipeline from a feature branch; remove before merge
      - feat/aie-modifications-v1.18.31
    tags: ['v*-aie']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: aie-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history + tags for prerelease counter)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun + install deps
        uses: ./.github/actions/setup-bun

      - name: Resolve AIE version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            CHANNEL="latest"
            IS_PRERELEASE="false"
          else
            BASE=$(jq -r '.version' packages/opencode/package.json)
            EXISTING=$(git tag -l "v${BASE}-a.*" | sed "s/v${BASE}-a\.//" | sort -n | tail -1 || true)
            if [ -z "${EXISTING}" ]; then
              NEXT=1
            else
              NEXT=$((EXISTING + 1))
            fi
            VERSION="${BASE}-a.${NEXT}"
            CHANNEL="aie"
            TAG="v${VERSION}"
            IS_PRERELEASE="true"
          fi
          echo "version=${VERSION}"     >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}"      >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-}"            >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION} channel=${CHANNEL} prerelease=${IS_PRERELEASE}"

      - name: Build all platform binaries
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          OPENCODE_CHANNEL: ${{ steps.ver.outputs.channel }}
        working-directory: packages/opencode
        run: bun run build

      - name: Configure npm for GitHub Packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@telekom"

      - name: Publish to GitHub Packages
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          OPENCODE_CHANNEL: ${{ steps.ver.outputs.channel }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/opencode
        run: bun run ./script/publish-github-aie.ts

      - name: Tag prerelease
        if: steps.ver.outputs.is_prerelease == 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        shell: bash
        run: |
          git config user.email "ci@telekom"
          git config user.name "telekom-ci"
          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Pushed prerelease tag ${TAG}"
