name: aie-publish

# Create the GitHub Release UI artifact for an AIE stable release: release
# notes + tag annotation + downloadable binary archives. This workflow is
# the "Release" surface; npm publishing to GitHub Packages is handled side-by-side
# by .github/workflows/aie-package.yml on the same `v*-aie` tag push.
#
#   - push tag `v*-aie`      -> create the Release, attach dist/*.zip and dist/*.tar.gz
#
# Notes:
#   - The release is created as a draft first so `gh release upload` inside
#     packages/opencode/script/build.ts (gated by OPENCODE_RELEASE + GH_REPO)
#     succeeds; the final softprops step un-drafts it and re-uploads the same
#     archives (idempotent, --clobber on both sides).
#   - Pin softprops/action-gh-release to a SHA before merging (the repo pins
#     third-party actions by SHA, not floating tags).

on:
  push:
    tags: ['v*-aie']

permissions:
  contents: write

concurrency:
  group: aie-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun + install deps
        uses: ./.github/actions/setup-bun

      - name: Resolve AIE version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "Resolved release version=${VERSION} tag=${TAG}"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          draft: true

      - name: Build all platform binaries + archive assets
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          OPENCODE_CHANNEL: latest
          OPENCODE_RELEASE: true
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: packages/opencode
        run: bun run build

      - name: Publish release (un-draft + attach archives)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          draft: false
          files: |
            packages/opencode/dist/*.zip
            packages/opencode/dist/*.tar.gz
