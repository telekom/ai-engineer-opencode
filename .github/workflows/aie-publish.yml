name: aie-publish

# Create the GitHub Release UI artifact for an AIE stable release: release
# notes + tag annotation + downloadable binary archives. This workflow is
# the "Release" surface; npm publishing is handled side-by-side by
# .github/workflows/aie-package.yml on the same `v*-aie` tag push.
#
#   - push tag `v*-aie`      -> create the Release, attach dist/archives/*
#
# Notes:
#   - v2 build.ts and pack.ts only write files (binaries into packages/cli/dist/,
#     tarballs into dist/npm, standalone archives into dist/archives at the
#     repository root); no OPENCODE_RELEASE upload exists, so the release is
#     created once after the build with softprops.
#   - The npm tarballs (which pack.ts also produces) are the assets for every
#     platform the archives step does not cover: pack.ts archives linux
#     standalone archives (tar.gz) only, so windows/darwin users install from
#     the registry or unpack the npm tarballs.

on:
  push:
    tags: ['v*-aie']

permissions:
  contents: write

concurrency:
  group: aie-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Bun + install deps
        uses: ./.github/actions/setup-bun

      - name: Resolve AIE version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "Resolved release version=${VERSION} tag=${TAG}"

      - name: Build all platform binaries
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          OPENCODE_CHANNEL: latest
        working-directory: packages/cli
        run: bun run build

      - name: Pack CLI into npm tarballs and standalone archives
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          OPENCODE_CHANNEL: latest
        working-directory: packages/cli
        run: bun run pack

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          draft: false
          files: |
            dist/archives/*.tar.gz
            dist/archives/*.zip
